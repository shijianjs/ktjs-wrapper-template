# Playwright's JUnit extension keeps one Playwright instance per thread, so the supported way to run
# the suite in parallel is class-level concurrency: each test class gets its own thread (and browser),
# while the tests inside a class stay on that thread.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
