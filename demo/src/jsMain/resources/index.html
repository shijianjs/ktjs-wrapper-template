<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Demo of ktjs-wrapper-template: a Kotlin/JS wrapper around @vaadin/button, written as custom elements with shadow-scoped styles.">
    <title>ktjs-wrapper-template demo</title>
    <link rel="icon" href="img/ktjs-wrapper-template-logo.png">
    <script src="demo.js" defer></script>
</head>
<body style="margin: 0; background: #ffffff">
<noscript>This demo is written in Kotlin/JS and needs JavaScript enabled.</noscript>
<!-- The page is a custom element like everything inside it; `class="page"` is the hook the browser
     suite asserts on. It upgrades when demo.js defines the tag, and renders itself into its shadow. -->
<ktjs-demo-page id="demo" class="page"></ktjs-demo-page>
</body>
</html>
