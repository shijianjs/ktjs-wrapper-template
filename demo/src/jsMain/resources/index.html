<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Demo of ktjs-wrapper-template: a Kotlin/JS wrapper around @vaadin/button, written as custom elements with shadow-scoped styles.">
    <title>ktjs-wrapper-template demo</title>
    <link rel="icon" href="img/ktjs-wrapper-template-logo.png">
    <!-- Lumo's design tokens and the utility classes the shell uses; copied from the npm workspace. -->
    <link rel="stylesheet" href="lumo.css">
    <link rel="stylesheet" href="utility.css">
    <script src="demo.js" defer></script>
</head>
<body>
<!--
  The shell is named here, not created by the script: `main` defines the tag and mounts the site into
  the element the browser built, so there is exactly one `<ktjs-demo-layout>` on the page.
-->
<ktjs-demo-layout id="demo"></ktjs-demo-layout>
<noscript>This demo is written in Kotlin/JS and needs JavaScript enabled.</noscript>
</body>
</html>
