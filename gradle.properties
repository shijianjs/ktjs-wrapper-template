kotlin.js.yarn=false

# Browser test suites and the Kotlin daemon can exhaust the default heap on CI runners.
kotlin.daemon.jvmargs=-Xmx3g

# Artifact and plugin versions are not kept here: `gradle/libs.versions.toml` is the single list,
# read through the generated `libs` accessor. This file only holds Gradle/Kotlin user settings.
#
# That includes the ktjs-docusaurus triple (plugin, wrapper klib, kit) and the kit modules the demo
# page builds on (`ktjs-dom-kit` with its `ksp` processor, `ktjs-demo-kit-js`,
# `ktjs-vaadin-web-components-js`, `ktjs-iconify-icon-js`). A `-SNAPSHOT` one resolves from
# `mavenLocal`: every working tree there publishes it with `./gradlew publishToMavenLocal`.