kotlin.js.yarn=false

# Browser test suites and the Kotlin daemon can exhaust the default heap on CI runners.
kotlin.daemon.jvmargs=-Xmx3g

# The ktjs-docusaurus versions the docs site is built with: the Gradle plugin (settings.gradle.kts)
# and the wrapper klib (docs/build.gradle.kts). Both come from that project, but every module there
# carries its own `-kt.N` revision, so the two versions are independent and both are needed.
#
# `mavenLocal` in settings.gradle.kts resolves a SNAPSHOT here: a working tree of ktjs-docusaurus
# publishes one with `./gradlew publishToMavenLocal` (root build for the klib) and the same task in
# `ktjs-docusaurus-gradle-plugin/` (for the plugin). Released versions come from Maven Central and
# need neither.
ktjs-docusaurus.version=3.10.2-kt.2
ktjs-docusaurus-gradle-plugin.version=3.10.2-kt.1
