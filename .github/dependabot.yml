version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # IntelliJ IDEA 2026.2.3 fails to sync with Gradle 9.8.x
      # (ExternalSystemPartialResolutionException with an empty message).
      # Keep the wrapper on the last version that syncs until the IDE is fixed.
      - dependency-name: "gradle-wrapper"
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
      kotlin-wrappers:
        patterns:
          - "org.jetbrains.kotlin-wrappers*"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
    groups:
      # One PR per upstream ecosystem. Add a pattern per scope/package family as modules grow.
      upstream:
        patterns:
          - "__NPM_PACKAGE__"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
